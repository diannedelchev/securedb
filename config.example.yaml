# SecureDB Web Client configuration
#
# Precedence: built-in defaults < this file < environment variables.
# Runtime-tunable settings (session timeouts) are seeded from here into the
# app_settings table on first boot and edited afterwards on the Settings page.

app:
  addr: ":8080"
  env: development          # development | production
  cookie_secure: false      # true when serving over HTTPS
  trust_proxy_ip: false     # true only behind a trusted reverse proxy
  # REQUIRED — 32-byte hex key for AES-256-GCM credential encryption.
  # Generate with: openssl rand -hex 32
  encryption_key: ""

# Application database — an existing PostgreSQL server.
# Defaults below match the docker-compose `app-db` service (published on the
# host as localhost:5433, used by `make dev`). Point these at your own
# PostgreSQL server for a real deployment; use either discrete fields or a
# full `url` (url wins).
database:
  host: localhost
  port: 5433
  name: securedb
  user: securedb
  password: securedb
  sslmode: disable
  # url: postgres://securedb:securedb@localhost:5433/securedb?sslmode=disable

sessions:
  ttl: 8h        # absolute session lifetime
  idle_ttl: 45m  # idle timeout

seed:
  # Single login account created on first boot (only when no users exist).
  # Set a password here or via SEED_ADMIN_PASSWORD before first boot.
  # Empty passwords are rejected; credentials are never printed to logs.
  admin:
    email: admin@securedb.local
    password: ""
    name: Administrator
