services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILE: /etc/securedb/config.yaml
    volumes:
      # All configuration comes from config.yaml (create it with `make config`,
      # see config.example.yaml). NOTE: inside the container `localhost` is the
      # container itself — set database.host to `host.docker.internal` to reach
      # a PostgreSQL server running on the Docker host.
      - ./config.yaml:/etc/securedb/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional Redis (not required by the MVP; enable with --profile cache)
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"